
name: Build Apple Wallet Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WalletLarpSimulator-AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o WalletLarpSimulator-AndroidStudio.zip -d project

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Wallet-Simulator-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
