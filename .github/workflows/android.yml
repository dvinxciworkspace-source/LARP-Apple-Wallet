name: Build Apple Wallet Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WalletLarpSimulator-AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o WalletLarpSimulator-AndroidStudio.zip -d project

      - name: Build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Wallet-Simulator-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
